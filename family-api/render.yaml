# LifeSims family prototype: isolated service and existing 30-day test database.
# The database "lifesims-family-test" already exists in Anna's Render workspace.
# This configuration does NOT modify the Oura bridge or the menu website.
# Free Render Postgres expires 2026-12-23; not a production storage solution.
services:
  - type: web
    name: lifesims-family-test-api
    repo: https://github.com/ansitnikkodland-alt/lifesims-web
    branch: feature/cloud-family-accounts-20261123
    runtime: node
    plan: free
    region: frankfurt
    rootDir: family-api
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifesims-family-test
          property: connectionString
