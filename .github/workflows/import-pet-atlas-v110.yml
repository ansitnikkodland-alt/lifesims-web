name: Import improved realistic pet sprites (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-pet-atlas-v110.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the LifeSims repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved high-resolution transparent sprite atlas
        env:
          SOURCE_IMAGE: 'https://pikaso.cdnpk.net/private/production/6121263891/3906229611.webp?token=exp=1795737600~hmac=7395d2a3d963ebdb1cbecf80491086c47f4f170006589c74693893df8904a1a0'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 80 "$SOURCE_IMAGE" --output scene/pets-realistic-atlas-v110.webp
          echo "12ec4be8fc21372600335c5b76ce9d6a4a9a628b8bb4ea915b2ee37913c63332  scene/pets-realistic-atlas-v110.webp" | sha256sum -c -
          test "$(wc -c < scene/pets-realistic-atlas-v110.webp)" -eq 21952
      - name: Commit pet texture to the application (not a third-party hotlink)
        run: |
          set -euo pipefail
          git config user.name "LifeSims Asset Bot"
          git config user.email "lifesims-assets@users.noreply.github.com"
          git add scene/pets-realistic-atlas-v110.webp
          git commit -m "LifeSims v110: add crisp realistic ginger and black pet sprites"
          git push
