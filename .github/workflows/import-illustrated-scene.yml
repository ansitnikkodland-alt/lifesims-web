name: Import approved LifeSims illustrated room
on:
  push:
    paths:
      - '.github/workflows/import-illustrated-scene.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download approved illustration
        env:
          IMAGE_URL: 'https://pikaso.cdnpk.net/private/production/6111450432/3901860400.png?token=exp=1795478400~hmac=65060a8514272833a2ae5f786761bb6d13cfc326eb8478b6e4fe1baca25b5f2e'
        run: |
          curl --fail --location --retry 2 --silent --show-error "$IMAGE_URL" -o /tmp/lifesims-approved.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          source=Image.open('/tmp/lifesims-approved.png').convert('RGB')
          assert source.width>1000 and source.height>700, source.size
          source.save('scene/room-illustrated-v42.jpg',format='JPEG',quality=89,optimize=True,progressive=True,subsampling=0)
          import os
          print('Approved art',source.size,'saved JPEG bytes',os.path.getsize('scene/room-illustrated-v42.jpg'))
          PY
      - name: Commit approved visual asset to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scene/room-illustrated-v42.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add approved LifeSims illustrated room with embedded fridge, shower and phone"
            git push
          fi
