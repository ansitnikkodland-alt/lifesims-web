name: LifeSims skill details and last meal smoke
on:
  push:
    paths:
      - 'scene/index.html'
      - 'scene/skill-detail.js'
      - 'scene/habit-grid.js'
      - 'scene/task-premium.css'
      - '.github/workflows/lifesims-skill-food-smoke.yml'
  workflow_dispatch:
jobs:
  skill-and-food:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright-core@1.56.1
      - name: Serve site
        run: |
          python3 -m http.server 8765 > /tmp/lifesims-test-http.log 2>&1 &
          sleep 2
      - name: Test skills navigation and last meal edit
        run: |
          cat > /tmp/lifesims-skill-food.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto('http://127.0.0.1:8765/scene/?smoke=skill-food',{waitUntil:'domcontentloaded'});
            await page.locator('[data-tab="skills"]').click();
            await page.locator('.skill-clickable').first().waitFor();
            const p=page.locator('.skill-clickable').filter({hasText:'Психология'}).first();
            await p.click();
            await page.locator('#skillDetailDialog').waitFor({state:'visible'});
            if(!await page.locator('#skillDetailBody').innerText().then(t=>t.includes('Читать')&&t.includes('История изменений навыка')&&t.includes('Общий опыт')))
              throw Error('Skill detail missing linked habit or XP data');
            if(await page.locator('#skillDetailBody').innerText().then(t=>t.includes('Уровень')||t.includes('До следующего уровня')||t.includes('XP внутри уровня')))
              throw Error('Old level UI still shown');
            if(await page.locator('#manualSkillLevel').count()||await page.locator('#manualSkillWithin').count())
              throw Error('Level-based inputs still exist');
            const original=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            await page.locator('#manualSkillExperience').fill('6900.5');
            await page.locator('#skillDetailBody .skill-manual-save').click();
            const updated=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(Math.abs(updated-6900.5)>0.051)
              throw Error('Editing flat XP failed: '+updated);
            if(!await page.locator('#skillDetailBody').innerText().then(t=>t.includes('6 900,5')||t.includes('6 900,5')))
              throw Error('Edited XP not reflected in the skill dialog');
            if(await page.locator('.skill-clickable').filter({hasText:'Психология'}).innerText().then(t=>/Уровень|\/ 100 XP/.test(t)))
              throw Error('Level display remained on skill card');
            await page.evaluate(()=>window.LifeSimsSkillBridge.undoScore('Психология'));
            const restored=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(Math.abs(restored-original)>0.1)
              throw Error('Undo flat XP changed previous skill state: '+restored+' vs '+original);
            console.log('FLAT SKILL XP EDIT + UNDO + NO LEVELS: PASS');

            const skillTrack=page.locator('.skill-clickable').filter({hasText:'Психология'}).locator('.skill-xp-track');
            const detailTrack=page.locator('#skillDetailBody .skill-xp-track');
            if(!await skillTrack.isVisible()||!await detailTrack.isVisible())
              throw Error('Continuous XP progress tracks are missing');
            const initialWidth=await skillTrack.locator('div').getAttribute('style');
            if(await skillTrack.getAttribute('role')!=='progressbar'||await detailTrack.getAttribute('role')!=='progressbar')
              throw Error('Skill XP bar is not accessible');
            const scale=await page.evaluate(()=>window.LifeSimsSkillBridge.displayScale());
            if(scale<100||await detailTrack.getAttribute('aria-valuemax')!==String(scale))
              throw Error('XP scale is not shared between cards and details');
            await page.locator('#manualSkillExperience').fill('350');
            await page.locator('#skillDetailBody .skill-manual-save').click();
            const manualWidth=await skillTrack.locator('div').getAttribute('style');
            if(initialWidth===manualWidth||await skillTrack.getAttribute('aria-valuenow')!=='350')
              throw Error('XP progress track did not update after manual save');
            await page.evaluate(()=>window.LifeSimsSkillBridge.undoScore('Психология'));
            await page.evaluate(()=>{
              const slider=document.getElementById('manualSkillXpSlider');
              slider.value='42.5';slider.dispatchEvent(new Event('input',{bubbles:true}));
            });
            if(await page.locator('#manualSkillExperience').inputValue()!=='42.5')
              throw Error('XP slider did not update exact input');
            await page.locator('#skillDetailBody .skill-manual-save').click();
            const sliderValue=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(Math.abs(sliderValue-42.5)>0.05)throw Error('XP slider save failed: '+sliderValue);
            await page.evaluate(()=>window.LifeSimsSkillBridge.undoScore('Психология'));
            console.log('XP BARS + EXACT MANUAL FIELD + SLIDER + UNDO: PASS');
            const habitBefore=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            await page.evaluate(()=>{
              window.LifeSimsTaskBridge.complete('books_read',window.LifeSimsSkillBridge.today());
            });
            const habitAfter=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(habitAfter<=habitBefore||await skillTrack.getAttribute('aria-valuenow')!==String(habitAfter))
              throw Error('Linked completed habit did not update skill and XP bar: '+habitBefore+' -> '+habitAfter);
            console.log('COMPLETED HABIT -> AUTOMATIC SKILL XP BAR: PASS');
            await page.locator('#skillDetailClose').click();
            await page.evaluate(()=>window.LifeSimsTaskBridge.create('task'));
            await page.locator('#calendarTaskPopup').waitFor({state:'visible'});
            await page.locator('#taskTitle').fill('Проверка задания на XP');
            await page.locator('#taskRepeat').selectOption('once');
            await page.locator('#taskXP').selectOption('20');
            await page.locator('#taskSkill').fill('Психология');
            await page.locator('#taskSave').click();
            const taskId=await page.evaluate(()=>{
              return window.LifeSimsTaskBridge.read().activities.find(a=>a.name==='Проверка задания на XP')?.id;
            });
            if(!taskId)throw Error('Task creation with linked skill failed');
            const taskBefore=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            await page.evaluate(id=>window.LifeSimsTaskBridge.complete(id,window.LifeSimsSkillBridge.today()),taskId);
            const taskAfter=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(taskAfter<=taskBefore||await skillTrack.getAttribute('aria-valuenow')!==String(taskAfter))
              throw Error('Linked completed task did not update skill bar');
            console.log('COMPLETED TASK -> AUTOMATIC SKILL XP BAR: PASS');
            const eventId='xp-skill-event-regression';
            await page.evaluate(id=>{
              const day=window.LifeSimsSkillBridge.today();
              window.LifeSimsCalendarBridge.upsert([{
                id,title:'Учебное мероприятие по психологии',repeat:'none',
                startsAt:new Date(day+'T00:01:00').toISOString(),
                endsAt:new Date(day+'T00:02:00').toISOString(),
                skill:'Психология',skills:['Психология'],skillXp:2
              }]);
            },eventId);
            const eventAfter=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(Math.abs(eventAfter-taskAfter-2)>0.1)
              throw Error('Completed calendar event did not yield one +2 XP: '+taskAfter+' -> '+eventAfter);
            if(await skillTrack.getAttribute('aria-valuenow')!==String(eventAfter))
              throw Error('Completed calendar event did not refresh XP bar');
            await page.evaluate(()=>{
              const past=window.LifeSimsCalendarBridge.getSchedule().find(e=>e.id==='xp-skill-event-regression');
              window.LifeSimsCalendarBridge.upsert([past]);
            });
            const resynced=await page.evaluate(()=>window.LifeSimsSkillBridge.scores().find(s=>s.name==='Психология').score);
            if(Math.abs(resynced-eventAfter)>0.1)
              throw Error('Calendar resynchronization duplicated XP');
            console.log('COMPLETED EVENT -> AUTOMATIC +2 XP BAR, WITHOUT DUPLICATE: PASS');
            await page.locator('.skill-clickable').filter({hasText:'Психология'}).first().click();
            await page.locator('#skillDetailDialog').waitFor({state:'visible'});

            await page.locator('#skillDetailBody .skill-detail-action').filter({hasText:'Читать'}).first().locator('button').click();
            await page.locator('#calendarTaskPopup').waitFor({state:'visible'});
            if(!await page.locator('#taskSkill').locator('xpath=..').innerText().then(t=>t.includes('Психология')))
              throw Error('Skill linked editor lost multi-skill binding');
            await page.locator('#taskCancel').click();
            console.log('SKILL DETAILS + ASSOCIATED HABIT EDITOR: PASS');
            const setup=await page.evaluate(()=>{
              const b=window.LifeSimsFoodBridge,day=b.today();
              const old=b.upsert({date:day,time:'08:00',title:'Завтрак для проверки',grams:150,kcal:200,protein:10,fat:8,carbs:20});
              const last=b.upsert({date:day,time:'19:15',title:'Ужин для проверки',grams:220,kcal:420,protein:25,fat:15,carbs:40});
              return {day,oldId:old.id,lastId:last.id};
            });
            await page.locator('[data-tab="habits"]').click();
            const row=page.locator('tr.tp-habit-observed').filter({hasText:'Последний приём пищи'});
            await row.locator('button.tp-habit-meal-edit').first().click();
            await page.locator('#food.open').waitFor({state:'visible'});
            if(await page.locator('#mealDescription').inputValue()!=='Ужин для проверки')throw Error('Opened wrong meal');
            if(await page.locator('#mealTime').inputValue()!=='19:15')throw Error('Last meal time was not loaded');
            await page.locator('#mealTime').fill('20:30');
            await page.locator('#mealKcal').fill('425');
            await page.locator('#mealSave').click();
            const after=await page.evaluate(()=>{
              const b=window.LifeSimsFoodBridge,day=b.today();
              return b.list().filter(x=>x.date===day&&x.title.includes('для проверки'));
            });
            if(after.length!==2||!after.some(x=>x.id===setup.oldId&&x.time==='08:00')||
               !after.some(x=>x.id===setup.lastId&&x.time==='20:30'&&x.kcal===425))
              throw Error('Editing last meal created a duplicate or failed: '+JSON.stringify(after));
            console.log('LAST MEAL EDIT BY ID, TIME, CALORIES, NO DUPLICATES: PASS');
            if(pageErrors.length)throw Error('Unexpected page error: '+pageErrors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lifesims-skill-food.cjs
