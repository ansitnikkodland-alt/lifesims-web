name: Build LifeSims Android usage companion

on:
  push:
    paths:
      - 'android-companion/**'
      - '.github/workflows/lifesims-android-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile project
        working-directory: android-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifesims-screen-time-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
