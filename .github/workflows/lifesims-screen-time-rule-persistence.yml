name: LifeSims screen time project defaults after sync
on:
  push:
    paths:
      - 'scene/index.html'
      - 'scene/screen-time-links.js'
      - 'scene/screen-time-report.js'
      - 'tests/screen-time-rule-persistence.cjs'
      - '.github/workflows/lifesims-screen-time-rule-persistence.yml'
  workflow_dispatch:
jobs:
  project-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Start isolated LifeSims
        run: |
          python3 -m http.server 8765 >/tmp/lifesims-screen-time.log 2>&1 &
          sleep 2
      - name: Verify app projects persist through sync and reload
        run: node tests/screen-time-rule-persistence.cjs
