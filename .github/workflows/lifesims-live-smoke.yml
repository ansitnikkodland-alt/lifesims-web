name: Verify published LifeSims habit update
on:
  push:
    paths:
      - '.github/workflows/lifesims-live-smoke.yml'
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:
jobs:
  live-habits:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Verify public site and active habit UI
        run: |
          cat > .lifesims-live-check.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            let ready=false;
            for(let i=0;i<20;i++){
              const response=await page.goto('https://ansitnikkodland-alt.github.io/lifesims-web/scene/?integrity=v60&check='+i,{
                waitUntil:'domcontentloaded',timeout:30000
              });
              if(!response?.ok())throw Error('Pages response '+response?.status());
              ready=(await page.locator('body').innerText()).includes('Моя жизнь · v60');
              if(ready)break;
              await page.waitForTimeout(4500);
            }
            if(!ready)throw Error('Published GitHub Pages still serves an older version, expected v60');
            const loaded=await page.evaluate(()=>({
              planner:!!window.LifeSimsTaskPremium,
              habits:!!window.LifeSimsHabitGrid,
              serviceWorkerAvailable:'serviceWorker'in navigator
            }));
            if(!loaded.planner||!loaded.habits)throw Error('New JS modules were not loaded: '+JSON.stringify(loaded));
            await page.locator('[data-tab="habits"]').first().click();
            await page.locator('#premiumHabitsUI').waitFor({state:'visible',timeout:10000});
            await page.evaluate(()=>{
              const api=window.LifeSimsTaskBridge,day=api.today(),acts=api.read().activities;
              acts.push({id:'__live_test',name:'Алкоголь',kind:'habit',repeat:'daily',xp:-5,negative:true,
                completions:[{date:day,at:new Date().toISOString()}],createdDate:day});
              window.LifeSimsHabitGrid.render();
            });
            const row=page.locator('.tp-habit-table tbody tr').filter({
              has:page.locator('.tp-habit-edit-name',{hasText:'Алкоголь'})
            }).last();
            const red=await row.locator('.tp-habit-day').first().evaluate(el=>{
              const style=getComputedStyle(el);
              return {className:el.className,background:style.backgroundColor,color:style.color,
                isNegative:el.classList.contains('is-negative')};
            });
            if(!red.isNegative)throw Error('Completed negative habit missing red style: '+JSON.stringify(red));
            await row.locator('button.tp-habit-edit-name').click();
            await page.locator('#calendarTaskPopup').waitFor({state:'visible',timeout:6000});
            if(await page.locator('#taskTitle').inputValue()!=='Алкоголь')
              throw Error('Tapping habit title did not open correct editor');
            if(!await page.locator('#tpNegativeHabit').isChecked())
              throw Error('Negative habit flag was not available in published editor');
            console.log('LIVE GITHUB PAGES v60: PASS');
            console.log('NEW SCRIPTS PRESENT:',JSON.stringify(loaded));
            console.log('NEGATIVE HABIT RED:',JSON.stringify(red));
            if(errors.length)console.warn('OTHER PAGE ERRORS:',errors.slice(0,5).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .lifesims-live-check.cjs