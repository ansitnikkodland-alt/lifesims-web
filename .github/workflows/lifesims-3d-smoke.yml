name: LifeSims illustrated room smoke test
on:
  push:
    paths:
      - 'scene/index.html'
      - 'scene/room-illustrated-v42.jpg'
      - '.github/workflows/lifesims-3d-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Start local static server
        run: |
          python3 -m http.server 8765 > /tmp/lifesims_http.log 2>&1 &
          sleep 2
      - name: Verify illustration, navigation and room interactions
        run: |
          cat > .lifesims-illustrated-check.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']
            });
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const problems=[];
            page.on('pageerror',e=>problems.push('PAGE: '+e.message));
            page.on('console',m=>{if(m.type()==='error')problems.push('CONSOLE: '+m.text())});
            await page.goto('http://127.0.0.1:8765/scene/',{waitUntil:'domcontentloaded'});
            await page.locator('#sceneImage').waitFor();
            await page.waitForFunction(()=>document.getElementById('sceneImage')?.complete &&
              document.getElementById('sceneImage').naturalWidth>1000,{timeout:18000});
            const art=await page.evaluate(()=>{
              const img=document.getElementById('sceneImage'),scene=document.getElementById('scene');
              const b=scene.getBoundingClientRect(),r=img.getBoundingClientRect();
              return {url:img.currentSrc,width:img.naturalWidth,height:img.naturalHeight,
                sceneWidth:b.width,sceneHeight:b.height,shown:r.width===b.width&&r.height===b.height,
                webglAbsent:!document.getElementById('life3dCanvas'),
                notStretched:Math.abs(b.width/b.height-img.naturalWidth/img.naturalHeight)<.02,
                fridgeTransparent:getComputedStyle(document.getElementById('sceneFridge')).backgroundImage==='none'};
            });
            console.log('APPROVED ROOM:',JSON.stringify(art));
            if(!art.shown||!art.notStretched||!art.webglAbsent||!art.fridgeTransparent)
              throw Error('Approved illustration not displayed correctly');
            await page.screenshot({path:'life-illustrated-v42.png',fullPage:false});
            for(const tab of ['tasks','habits','history','needs']){
              await page.locator('[data-tab="'+tab+'"]').first().click();
              const active=await page.locator('#'+tab).evaluate(x=>x.classList.contains('active'));
              if(!active)throw Error('Main section not active: '+tab);
            }
            console.log('MAIN NAVIGATION: PASS');
            const tests=[['scenePhone','Финансовый контроль'],['sceneFridge','Поесть и записать еду'],
              ['showerCabin','Принять душ'],['sceneToilet','Помыть туалет'],
              ['sceneCatLitter','Обновить туалет котиков']];
            for(const [id,expected] of tests){
              await page.locator('#'+id).click({timeout:5000});
              const title=await page.locator('#sheetActions').innerText();
              if(!title.includes(expected))throw Error('Missing action on '+id+': '+title.slice(0,170));
              const button=page.locator('#sheetActions > button').first();
              if(!await button.isVisible())throw Error('Action not visible: '+id);
              await page.locator('#closeSheet').click();
              if(await page.locator('#sheetWrap').evaluate(x=>x.classList.contains('open')))
                throw Error('Popup did not close: '+id);
              console.log('ROOM ACTION OK:',id);
            }
            await page.locator('.touchmap [data-object="bed"]').click();
            if(!await page.locator('#sheetWrap').evaluate(x=>x.classList.contains('open')))
              throw Error('Bed menu did not open');
            await page.locator('#closeSheet').click();
            if(problems.length)console.warn('Browser messages:',problems.join(' | ').slice(0,800));
            console.log('ILLUSTRATED LIFE SIMS SMOKE: PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .lifesims-illustrated-check.cjs
      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesims-illustrated-v42
          path: life-illustrated-v42.png
          if-no-files-found: ignore
