name: Verify LifeSims app usage icon and attribution rules
on:
  push:
    paths:
      - '.github/workflows/lifesims-screen-time-links-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Test app links and persistence on published LifeSims
        run: |
          cat > .life-usage-links-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',
              headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              let response;
              for(let i=0;i<20;i++){
                response=await page.goto('https://ansitnikkodland-alt.github.io/lifesims-web/scene/?v=117&run='+i,
                   {waitUntil:'domcontentloaded',timeout:35000});
                if(response.ok()&&(await page.locator('body').innerText()).includes('Моя жизнь · v117'))break;
                await page.waitForTimeout(3500);
              }
              assert(response.ok(),'public site unavailable');
              await page.waitForFunction(()=>!!window.LifeSimsScreenTimeLinks?.open,{timeout:25000});
              const day=await page.evaluate(()=>{
                const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),
                  String(d.getDate()).padStart(2,'0')].join('-');
              });
              const sample={date:day,app:'ChatGPT',packageName:'com.openai.chatgpt',
                device:'Smoke Android',seconds:2400,source:'android'};
              const created=await page.evaluate(sample=>window.LifeSimsScreenTimeBridge.commit([sample]),sample);
              assert(created.ok,'cannot save test observation');
              await page.evaluate(day=>window.LifeSimsScreenTimeBridge.openAgenda(day),day);
              const app=page.locator('.sf-app-action',{hasText:'ChatGPT'});
              await app.waitFor({timeout:10000});
              assert(await app.locator('.sf-app-icon').count()===1,'icon or fallback missing');
              await app.click();
              const dialog=page.locator('#sfLinkDialog');
              assert(await dialog.isVisible(),'association editor missing');
              await dialog.locator('label',{hasText:'Навык'}).locator('select').selectOption({label:'Программирование'});
              await dialog.getByRole('button',{name:'Сохранить по умолчанию'}).click();
              const saved=await page.evaluate(sample=>
                window.LifeSimsScreenTimeBridge.link({...sample,date:'2026-11-24'}),sample);
              assert(saved.isDefault&&saved.link.skill==='Программирование','future default not applied');
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!!window.LifeSimsScreenTimeBridge,{timeout:20000});
              const restored=await page.evaluate(sample=>window.LifeSimsScreenTimeBridge.link(sample),sample);
              assert(restored.link.skill==='Программирование','rule not persisted after reload');
              console.log('Association editor, app icon placeholder, future defaults, persistence OK');
              assert.equal(errors.length,0,'JS errors: '+errors.join('; '));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node .life-usage-links-smoke.cjs
