name: LifeSims v110 pet click smoke (one-time)
on:
  push:
    paths:
      - '.github/workflows/pet-scene-v110-smoke.yml'
permissions:
  contents: read
jobs:
  pets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.56.1
      - name: Verify both pet click targets and clear images
        run: |
          python3 -m http.server 8765 >/tmp/lifesims-pets-http.log 2>&1 &
          sleep 2
          cat > .lifesims-pet-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const problems=[];
            page.on('pageerror',error=>problems.push(error.message));
            await page.goto('http://127.0.0.1:8765/scene/',{waitUntil:'domcontentloaded'});
            await page.locator('.pet-hotspot.pet-ginger').waitFor({timeout:20000});
            const imageData=await page.evaluate(async()=>{
              const atlas=new Image();atlas.src='./pets-realistic-atlas-v110.webp?v=110';
              await atlas.decode();
              const cats=[...document.querySelectorAll('#scenePets .pet-hotspot')].map(el=>{
                const rect=el.getBoundingClientRect();
                const sprite=el.querySelector('.pet-realistic-sprite');
                return {name:el.getAttribute('aria-label'),width:rect.width,height:rect.height,
                  naturalBackground:getComputedStyle(sprite).backgroundImage};
              });
              return {naturalWidth:atlas.naturalWidth,naturalHeight:atlas.naturalHeight,
                pawCount:document.querySelectorAll('#scenePets .pet-paw').length,cats};
            });
            console.log('PET IMAGE:',JSON.stringify(imageData));
            if(imageData.naturalWidth<400||imageData.naturalHeight<150)
              throw Error('Still using low-resolution cat texture');
            if(imageData.pawCount!==0||imageData.cats.length!==2)
              throw Error('Pet overlays are not the expected two click targets');
            await page.locator('.pet-hotspot.pet-ginger').click({timeout:6000});
            if(!await page.locator('#lifePetsDialog').evaluate(x=>x.open))
              throw Error('Ginger cat click did not open card');
            await page.getByRole('button',{name:/Закрыть/}).last().click();
            await page.locator('.pet-hotspot.pet-black').click({timeout:6000});
            if(!await page.locator('#lifePetsDialog').evaluate(x=>x.open))
              throw Error('Black cat click did not open card');
            const content=await page.locator('#lifePetsDialog').innerText();
            if(!content.includes('Погладить')||!content.includes('Покормить'))
              throw Error('Pet care actions missing');
            await page.screenshot({path:'pets-v110-mobile.png',fullPage:false});
            if(problems.length)console.log('PAGE ERRORS:',problems.join(' | ').slice(0,800));
            console.log('PET SMOKE: PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .lifesims-pet-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifesims-v110-pet-scene
          path: pets-v110-mobile.png
          if-no-files-found: ignore
