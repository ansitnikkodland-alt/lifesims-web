name: LifeSims habit editor smoke
on:
  push:
    paths:
      - 'scene/index.html'
      - 'scene/habit-grid.js'
      - 'scene/task-premium.js'
      - 'scene/task-premium.css'
      - '.github/workflows/lifesims-habit-smoke.yml'
  workflow_dispatch:
jobs:
  habit-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Start local website
        run: |
          python3 -m http.server 8765 > /tmp/lifesims_ui_http.log 2>&1 &
          sleep 2
      - name: Test actual mobile habit grid and editor
        run: |
          cat > /tmp/lifesims-habit-check.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:8765/scene/?smoke=habits',{waitUntil:'domcontentloaded'});
            await page.locator('[data-tab="habits"]').first().click();
            await page.locator('#premiumHabitsUI').waitFor({state:'visible',timeout:10000});
            await page.locator('#tpHabitGrid .tp-habit-table').waitFor({state:'visible'});
            await page.evaluate(()=>{
              const api=window.LifeSimsTaskBridge;
              const today=api.today();
              const habits=api.read().activities;
              habits.push(
                {id:'__smoke_alcohol',kind:'habit',name:'Алкоголь',xp:-5,repeat:'daily',createdDate:today,completions:[{date:today,at:new Date().toISOString()}]},
                {id:'__smoke_reading',kind:'habit',name:'Читать тест',xp:10,negative:false,repeat:'daily',createdDate:today,completions:[{date:today,at:new Date().toISOString()}]}
              );
              window.LifeSimsHabitGrid.render();
            });
            const alcohol=page.locator('.tp-habit-table tbody tr').filter({has:page.locator('button.tp-habit-edit-name', {hasText:'Алкоголь'})}).first();
            const reading=page.locator('.tp-habit-table tbody tr').filter({has:page.locator('button.tp-habit-edit-name', {hasText:'Читать тест'})}).first();
            if(!await alcohol.locator('.tp-habit-day').first().evaluate(el=>el.classList.contains('is-negative')))
              throw Error('Alcohol completion was not marked as a negative habit');
            if(await reading.locator('.tp-habit-day').first().evaluate(el=>el.classList.contains('is-negative')))
              throw Error('Positive habit was incorrectly marked negative');
            console.log('HABIT CELL COLORS: PASS');
            await alcohol.locator('button.tp-habit-edit-name').click();
            await page.locator('#calendarTaskPopup').waitFor({state:'visible',timeout:6000});
            const input=await page.locator('#taskTitle').inputValue();
            const isNegative=await page.locator('#tpNegativeHabit').isChecked();
            if(input!=='Алкоголь'||!isNegative)
              throw Error('Habit editor mismatch: name='+input+', negative='+isNegative);
            console.log('HABIT NAME OPENS EDITOR: PASS');
            await page.locator('#taskCancel').click();
            if(await page.locator('#calendarTaskPopup').isVisible())
              throw Error('Habit editor did not close');
            console.log('EDITOR CLOSE: PASS');
            // Coffee is an editable stored habit; legacy espresso entries must remain intact.
            const coffee=page.locator('.tp-habit-table tbody tr').filter({has:page.locator('button.tp-habit-edit-name',{hasText:'Кофе'})}).first();
            if(await coffee.count()!==1)throw Error('Missing coffee habit row');
            await coffee.locator('button.tp-habit-edit-name').click();
            await page.locator('#calendarTaskPopup').waitFor({state:'visible'});
            if(await page.locator('#taskEditId').inputValue()!=='coffee_habit')throw Error('Coffee did not open its persisted editor');
            await page.locator('#tpHabitGoalType').selectOption('max');
            await page.locator('#tpHabitGoalValue').fill('2');
            await page.locator('#tpHabitUnit').fill('чаш.');
            await page.locator('#tpHabitQuestion').fill('Сколько чашек кофе сегодня?');
            await page.locator('#taskSave').click();
            await page.waitForFunction(()=>!document.querySelector('#calendarTaskPopup')?.open);
            const coffeeAfter=await page.evaluate(()=>{
              const a=window.LifeSimsTaskBridge.read().activities.find(x=>x.id==='coffee_habit');
              return a&&{type:a.habitGoal?.type,target:a.habitGoal?.value,unit:a.habitUnit,question:a.habitQuestion};
            });
            if(coffeeAfter?.type!=='max'||coffeeAfter?.target!==2||coffeeAfter?.unit!=='чаш.')throw Error('Coffee norm did not persist: '+JSON.stringify(coffeeAfter));
            await page.evaluate(()=>{
              const api=window.LifeSimsTaskBridge,d=api.today();
              api.coffeeAdd(d);api.coffeeAdd(d);api.coffeeAdd(d);
            });
            const coffeeCell=()=>page.locator('.tp-habit-table tbody tr').filter({has:page.locator('button.tp-habit-edit-name',{hasText:'Кофе'})}).first().locator('.tp-habit-day').first();
            if(!await coffeeCell().evaluate(el=>el.classList.contains('is-negative')))throw Error('Upper bound 2 not exceeded by 3 coffees');
            if(!await page.evaluate(()=>window.LifeSimsTaskBridge.read().events.filter(e=>e.kind==='espresso').length===3))throw Error('Coffee events were not saved');
            await page.evaluate(()=>window.LifeSimsTaskBridge.coffeeUndo(window.LifeSimsTaskBridge.today()));
            if(await coffeeCell().evaluate(el=>el.classList.contains('is-negative')))throw Error('Upper bound at 2 coffees incorrectly negative');
            await page.evaluate(()=>window.LifeSimsTaskBridge.setHabitAmount('coffee_habit',window.LifeSimsTaskBridge.today(),3.5));
            if(!await coffeeCell().evaluate(el=>el.classList.contains('is-negative')))throw Error('Manual quantity 3.5 must exceed maximum');
            await page.evaluate(()=>window.LifeSimsTaskBridge.setHabitAmount('coffee_habit',window.LifeSimsTaskBridge.today(),1.5));
            if(await coffeeCell().evaluate(el=>el.classList.contains('is-negative')))throw Error('Manual quantity 1.5 must be within maximum');
            await page.evaluate(()=>{
              const api=window.LifeSimsTaskBridge,d=api.today();
              api.read().activities.push({id:'__smoke_min',name:'Движение',kind:'habit',repeat:'daily',createdDate:d,
                xp:0,habitGoal:{type:'min',value:2},habitUnit:'км',completions:[{date:d,at:new Date().toISOString()}]});
              window.LifeSimsHabitGrid.render();
            });
            const lowerCell=()=>page.locator('.tp-habit-table tbody tr').filter({has:page.locator('button.tp-habit-edit-name',{hasText:'Движение'})}).first().locator('.tp-habit-day').first();
            if(!await lowerCell().evaluate(el=>el.classList.contains('is-negative')))throw Error('Lower bound not flagged');
            await page.evaluate(()=>window.LifeSimsTaskBridge.setHabitAmount('__smoke_min',window.LifeSimsTaskBridge.today(),3));
            if(await lowerCell().evaluate(el=>el.classList.contains('is-negative')))throw Error('Lower bound met, should not be negative');
            console.log('COFFEE EDITOR + BOTH NORM TYPES + MANUAL QUANTITIES: PASS');
            if(errors.length)console.warn('OTHER BROWSER CONSOLE ERRORS:',errors.slice(0,8).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lifesims-habit-check.cjs