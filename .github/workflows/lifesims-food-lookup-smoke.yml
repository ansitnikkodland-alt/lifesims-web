name: LifeSims smart recognition food regression
on:
  push:
    paths:
      - 'scene/meal-lookup.js'
      - 'scene/meal-photo.js'
      - 'scene/meal-chat.js'
      - 'scene/index.html'
      - '.github/workflows/lifesims-food-lookup-smoke.yml'
  workflow_dispatch:
jobs:
  food-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check food modules
        run: |
          node --check scene/meal-photo.js
          node --check scene/meal-chat.js
          node --check scene/meal-lookup.js
      - name: Install browser test tools
        run: npm install --no-save playwright-core@1.56.1
      - name: Serve LifeSims
        run: |
          python3 -m http.server 8765 > /tmp/lifesims-food-http.log 2>&1 &
          sleep 2
      - name: Test product selection nutrition calculation and barcode lookup
        run: |
          cat > /tmp/lifesims-food-lookup.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
           const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
           const page=await browser.newPage({viewport:{width:390,height:844}});
           const errors=[];
           page.on('pageerror',e=>errors.push(e.message));
           await page.route('https://world.openfoodfacts.org/**',route=>{
            const url=route.request().url();
            const product={code:'4601234567890',product_name_ru:'Творог тестовый',brands:'Тест',
             quantity:'200 г',nutriments:{'energy-kcal_100g':120,proteins_100g:10,fat_100g:5,carbohydrates_100g:4}};
            const response=url.includes('/4600000000000')?{status:0,product:null}:
             url.includes('/cgi/search.pl')?{products:[product]}:{status:1,product};
            route.fulfill({status:200,contentType:'application/json',
             headers:{'Access-Control-Allow-Origin':'*'},body:JSON.stringify(response)});
           });
           await page.goto('http://127.0.0.1:8765/scene/?smoke=smart-image',{waitUntil:'domcontentloaded'});
           await page.evaluate(()=>window.LifeSimsMealChat.open());
           await page.locator('#mealSmartCapture').waitFor({state:'visible'});
           if(await page.locator('#mealChatPhotoActions').isVisible())throw Error('Legacy photo buttons still visible');
           if(await page.locator('.meal-lookup-shortcuts').isVisible())throw Error('Old 3-way photo actions still visible');
           if(await page.locator('#mealSmartSources').isVisible())
            throw Error('Source picker should start closed');
           if(await page.locator('#mealSmartCameraInput').getAttribute('capture')!=='environment')
            throw Error('Camera input needs capture=environment');
           await page.locator('#mealSmartCapture').click();
           if(!await page.locator('#mealSmartTakePhoto').isVisible()||
              !await page.locator('#mealSmartChoosePhoto').isVisible())
            throw Error('One smart button did not reveal camera and gallery');
           await page.locator('#mealSmartCapture').click();
           if(await page.locator('#mealSmartSources').isVisible())
            throw Error('Camera/gallery picker would not close');
           console.log('SINGLE SMART BUTTON + CAMERA/GALLERY OPTIONS: PASS');
           // Manual product lookup still works under the hood for future text search.
           await page.evaluate(()=>document.getElementById('mealLookupSearchOpen').click());
           await page.locator('#mealLookupName').fill('Творог');
           await page.locator('#mealLookupFindName').click();
           await page.locator('.meal-lookup-result').first().waitFor();
           await page.locator('.meal-lookup-result').first().click();
           await page.locator('#mealLookupNutrition').waitFor({state:'visible'});
           await page.locator('#mealLookupGrams').fill('150');
           await page.locator('#mealChatSend').click();
           const entries=await page.evaluate(()=>window.LifeSimsFoodBridge.list().filter(x=>x.title.includes('Творог тестовый')));
           if(entries.length!==1||entries[0].grams!==150||entries[0].kcal!==180)
            throw Error('Product lookup nutrition save failed: '+JSON.stringify(entries));
           console.log('CATALOG SEARCH + MACROS: PASS');
           const parsed=await page.evaluate(()=>{
            return window.LifeSimsMealPhoto.extractNutrition(
             'Творог домашний\nСостав: молоко, закваска\nПищевая ценность на 100 г\nБелки: 12,5 г\nЖиры: 7 г\nУглеводы: 4,2 г\nЭнергетическая ценность: 133 ккал');
           });
           if(!parsed.isLabel||!parsed.per100Confirmed||parsed.per100?.kcal!==133||
            parsed.per100.protein!==12.5||parsed.per100.fat!==7||parsed.per100.carbs!==4.2||
            !parsed.ingredients.includes('молоко'))
             throw Error('Russian OCR label parser failed: '+JSON.stringify(parsed));
           if(await page.evaluate(()=>window.LifeSimsMealPhoto.typicalPortion('omelette'))!==180)
             throw Error('Typical portion mapping regression');
           console.log('RUSSIAN INGREDIENTS + CALORIES + PROTEIN/FAT/CARBS OCR PARSER: PASS');
           const image={name:'food-photo.png',mimeType:'image/png',
            buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/O5cAAAAASUVORK5CYII=','base64')};
           await page.evaluate(()=>{
            window.LifeSimsMealPhoto.compressedThumbnail=async()=>null;
            window.BarcodeDetector=class{
             static async getSupportedFormats(){return ['ean_13']}
             async detect(){return []}
            };
            window.Tesseract={recognize:async()=>({data:{text:
             'Батончик тестовый\nСостав: овес, орехи, мед\nПищевая ценность на 100 г\nБелки 10 г\nЖиры 8 г\nУглеводы 40 г\nКалорийность 272 ккал'}})};
           });
           await page.locator('#mealSmartCapture').click();
           const [labelPicker]=await Promise.all([
            page.waitForEvent('filechooser'),
            page.locator('#mealSmartChoosePhoto').click()
           ]);
           await labelPicker.setFiles(image);
           await page.locator('#mealLookupNutrition').waitFor({state:'visible',timeout:15000});
           if(await page.locator('#mealLookupKcal').inputValue()!=='272')throw Error('Smart OCR kcal missing');
           if(await page.locator('#mealLookupProtein').inputValue()!=='10')throw Error('Smart OCR protein missing');
           if(!await page.locator('#mealChatInput').inputValue().then(t=>t.includes('овес')))
             throw Error('Ingredients missing in smart OCR');
           if(!await page.locator('#mealLookupRawDetails').isVisible())throw Error('Original OCR text is hidden');
           await page.locator('#mealLookupGrams').fill('40');
           await page.locator('#mealChatSend').click();
           const label=await page.evaluate(()=>window.LifeSimsFoodBridge.list().find(x=>x.title==='Батончик тестовый'));
           if(!label||label.grams!==40||label.kcal!==109)
             throw Error('Smart label saving incorrect: '+JSON.stringify(label));
           console.log('ONE PHOTO BUTTON -> OCR LABEL -> INGREDIENTS/MACROS: PASS');
           await page.evaluate(()=>{
            // The test fixture is a 1-pixel PNG; bypass bitmap decoding to test barcode routing.
            window.createImageBitmap=async()=>({close(){}});
            window.BarcodeDetector=class{
             static async getSupportedFormats(){return ['ean_13']}
             async detect(){return [{rawValue:'4601234567890'}]}
            };
           });
           await page.locator('#mealSmartCapture').click();
           const [barcodePicker]=await Promise.all([
            page.waitForEvent('filechooser'),
            page.locator('#mealSmartChoosePhoto').click()
           ]);
           await barcodePicker.setFiles(image);
           await page.locator('#mealLookupNutrition').waitFor({state:'visible',timeout:15000});
           if(await page.locator('#mealLookupKcal').inputValue()!=='120')
            throw Error('Smart barcode lookup failed');
           await page.locator('#mealLookupGrams').fill('100');
           await page.locator('#mealChatSend').click();
           const barcode=await page.evaluate(()=>window.LifeSimsFoodBridge.list().find(x=>x.barcode==='4601234567890'));
           if(!barcode)throw Error('Smart barcode record missing');
           console.log('ONE PHOTO BUTTON -> BARCODE -> CATALOG: PASS');
           await page.evaluate(()=>{
            window.BarcodeDetector=class{
             static async getSupportedFormats(){return ['ean_13']}
             async detect(){return [{rawValue:'4600000000000'}]}
            };
           });
           await page.locator('#mealSmartCapture').click();
           const [unknownPicker]=await Promise.all([
            page.waitForEvent('filechooser'),page.locator('#mealSmartTakePhoto').click()
           ]);
           if(await page.locator('#mealSmartCameraInput').getAttribute('capture')!=='environment')
            throw Error('Camera option launched a gallery-only input');
           await unknownPicker.setFiles(image);
           await page.locator('#mealLookupNutrition').waitFor({state:'visible',timeout:15000});
           if(await page.locator('#mealLookupKcal').inputValue()!=='272')
            throw Error('Missing catalog item did not fall back to OCR');
           await page.locator('#mealLookupGrams').fill('50');
           await page.locator('#mealChatSend').click();
           const fallback=await page.evaluate(()=>window.LifeSimsFoodBridge.list().find(x=>x.barcode==='4600000000000'));
           if(!fallback||fallback.kcal!==136||!fallback.ingredients.includes('орехи'))
            throw Error('Unknown barcode fallback failed: '+JSON.stringify(fallback));
           console.log('UNKNOWN BARCODE -> OCR LABEL FALLBACK: PASS');
           await page.evaluate(()=>{
            window.LifeSimsMealPhoto.analyzeSmart=async()=>({kind:'meal',source:'Контрольная модель',
              title:'Омлет',per100:null,gramsEstimate:180,candidates:[],
              confidence:'Типичная порция, не измерена по фото'});
           });
           await page.locator('#mealSmartCapture').click();
           const [mealPicker]=await Promise.all([
            page.waitForEvent('filechooser'),page.locator('#mealSmartTakePhoto').click()
           ]);
           await mealPicker.setFiles(image);
           await page.locator('#mealChatPhotoPanel').waitFor({state:'visible'});
           await page.waitForFunction(()=>document.getElementById('mealChatPhotoGrams').value==='180');
           if(!await page.locator('#mealChatInput').inputValue().then(x=>x.includes('Омлет')))
            throw Error('Meal classifier did not propose a title');
           await page.locator('#mealChatPhotoGrams').fill('200');
           await page.locator('#mealChatSend').click();
           const meal=await page.evaluate(()=>window.LifeSimsFoodBridge.list().find(x=>x.title==='Омлет'));
           if(!meal||meal.grams!==200)throw Error('Smart meal portion could not be edited and saved');
           console.log('ONE PHOTO BUTTON -> MEAL -> APPROXIMATE EDITABLE PORTION (STUBBED MODEL): PASS');
           if(errors.length)throw Error('Unexpected JS page error: '+errors.join(' | '));
           await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});

          JS
          node /tmp/lifesims-food-lookup.cjs
