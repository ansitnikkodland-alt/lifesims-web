*{box-sizing:border-box}body{margin:0;background:#121a2b;color:#f6f7ff;font:15px system-ui,-apple-system,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#202b40}h1{font-size:21px;margin:0}small,.muted{color:#b7c6df}button,input,select{font:inherit;border-radius:11px;border:1px solid #50607c;padding:10px;background:#2b3c59;color:white}button{cursor:pointer}button.primary{background:#7163da;border-color:#7163da}button:active{transform:scale(.97)}.shell{max-width:800px;margin:auto;padding:12px}.panel{background:#202d42;border-radius:18px;padding:14px;margin:12px 0}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{background:#314363;border-radius:24px;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid button{min-height:44px}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap}.tabs .on{background:#7866de}h2{font-size:18px;margin:4px 0 12px}#scene{height:370px;position:relative;overflow:hidden;border-radius:17px;background:linear-gradient(#9bb8ca 0%,#c3d1dc 47%,#9c877b 48%,#756153 100%);perspective:850px;touch-action:pan-y}#world{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .3s}#back{position:absolute;left:9%;top:10%;width:82%;height:48%;background:linear-gradient(130deg,#d9e0dd,#b7cbd1);border:10px solid #e8e5dc;box-shadow:0 8px 25px #0004}#window{position:absolute;left:18%;top:17%;width:29%;height:23%;border:8px solid #f4f2e9;background:linear-gradient(#7ab9d9,#c5e6df);box-shadow:inset 0 0 0 2px #879eab}#window:after{content:'';position:absolute;left:47%;height:100%;width:6px;background:#f4f2e9}#floor{position:absolute;left:-20%;top:51%;width:140%;height:95%;background:repeating-linear-gradient(90deg,#9b7c63 0 31px,#8b705b 32px 34px);transform:rotateX(61deg);transform-origin:top}#rug{position:absolute;left:21%;top:69%;width:58%;height:21%;background:#b5aaa5;border:7px solid #e1d3c5;border-radius:50%;transform:rotateX(58deg)}.furn{position:absolute;border:0;background:transparent;padding:0;filter:drop-shadow(3px 7px 5px #0005);font-size:49px;z-index:4}.furn span{display:block;font-size:11px;background:#28394dcc;border-radius:8px;padding:2px 5px;white-space:nowrap}.bed{left:4%;top:57%}.sink{right:7%;top:48%}.desk{right:5%;top:73%}.book{left:6%;top:26%}.sim{position:absolute;left:45%;top:34%;width:110px;height:235px;z-index:5;transform:translateX(-50%);filter:drop-shadow(4px 8px 6px #0006);transition:left .5s,top .5s}.sim .hair{position:absolute;top:0;left:30px;width:51px;height:63px;border-radius:46% 46% 35% 35%;background:#453126;z-index:3}.sim .face{position:absolute;top:13px;left:34px;width:43px;height:53px;border-radius:42% 42% 47% 47%;background:#e6b59b;z-index:4}.sim .eyes{position:absolute;top:21px;left:7px;font-size:12px;letter-spacing:6px;color:#392c29}.sim .mouth{position:absolute;top:36px;left:17px;width:11px;height:5px;border-bottom:2px solid #a7535a;border-radius:50%}.sim .neck{position:absolute;top:60px;left:46px;width:18px;height:18px;background:#d9a48c}.sim .body{position:absolute;top:73px;left:24px;width:64px;height:80px;border-radius:22px 22px 12px 12px;background:linear-gradient(100deg,#9b83bf,#654f8b);z-index:2}.sim .arm{position:absolute;top:80px;width:16px;height:87px;border-radius:14px;background:#deb098;transform-origin:top}.sim .arm.l{left:13px;transform:rotate(9deg)}.sim .arm.r{right:10px;transform:rotate(-9deg)}.sim .leg{position:absolute;top:145px;width:24px;height:87px;background:linear-gradient(90deg,#393f58,#262c40);border-radius:5px 5px 11px 11px}.sim .leg.l{left:28px}.sim .leg.r{right:26px}.sim.walk .leg.l{animation:step .35s infinite alternate}.sim.walk .leg.r{animation:step .35s infinite alternate-reverse}@keyframes step{to{transform:rotate(13deg)}}.sim .shadow{position:absolute;top:226px;left:18px;width:75px;height:13px;border-radius:50%;background:#0004}.crystal{font-size:32px;cursor:pointer;filter:drop-shadow(0 0 8px var(--glow,#60d6bb))}.hidden{display:none!important}.msg{min-height:26px;color:#e4d6a5;margin:8px 0}.listitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #40506b;padding:9px 0}.listitem span{overflow-wrap:anywhere}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{min-width:0;flex:1}input[type=range]{width:100%}dialog{border:0;border-radius:20px;padding:20px;background:#26344e;color:white;max-width:min(94vw,450px)}dialog::backdrop{background:#0009}#notice{font-size:13px;color:#c3cde1}

</style></head><body><header><div><h1>LifeSims <small>3D mini</small></h1><small>Сим и интерактивная комната</small></div><div class="top"><button id="crystal" class="crystal" title="Изменить Ресурс">◆</button><b id="resourceText">70%</b></div></header><main class="shell"><section class="panel"><div class="top"><b id="status">Сим дома</b><button id="editRoom">Мебель и комната</button></div><div id="scene" aria-label="Комната с персонажем"><div id="world"><div id="back"></div><div id="window"></div><div id="floor"></div><div id="rug"></div><button class="furn book" data-object="books" aria-label="Книжный шкаф">📚<span>Книги</span></button><button class="furn bed" data-object="bed" aria-label="Кровать">🛏️<span>Кровать</span></button><button class="furn sink" data-object="sink" aria-label="Раковина">🚰<span>Раковина</span></button><button class="furn desk" data-object="desk" aria-label="Компьютер">💻<span>Компьютер</span></button><div id="sim" class="sim"><div class="shadow"></div><div class="hair"></div><div class="neck"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div class="body"></div><div class="face"><div class="eyes">• •</div><div class="mouth"></div></div></div></div></div><div class="msg" id="msg">Нажми на предмет в комнате, чтобы выбрать действие.</div><div class="grid"><button data-object="bed">🛏️ Кровать</button><button data-object="sink">🚰 Раковина</button><button data-object="books">📚 Книги</button><button data-object="desk">💻 Компьютер</button></div></section><section class="panel"><div class="tabs"><button class="on" data-tab="tasks">Задачи</button><button data-tab="skills">Навыки</button><button data-tab="data">Сохранения</button></div><div id="tasksTab"><h2>Задачи</h2><form id="taskForm" class="row"><input id="taskName" required placeholder="Новая задача"><select id="xp"><option value="5">5 XP</option><option value="10">10 XP</option><option value="20" selected>20 XP</option><option value="40">40 XP</option></select><button class="primary">Добавить</button></form><div id="taskList"></div></div><div id="skillsTab" class="hidden"><h2>Навыки</h2><div id="skillList"></div></div><div id="dataTab" class="hidden"><h2>Резервная копия</h2><p>Данные хранятся в браузере. Экспортируй их перед сменой версии.</p><button id="backup">Скачать JSON</button><input id="restoreFile" type="file" accept=".json,application/json"><button id="restore">Импортировать</button><p id="notice">Не удаляй старую версию, пока не проверишь перенос данных.</p></div></section></main><dialog id="dialog"><h2 id="dialogTitle">Действие</h2><div id="dialogBody"></div><div class="row" style="margin-top:14px"><button id="close">Закрыть</button></div></dialog><script>
const KEY='lifesims-personal-mini-v1';const defaults=()=>({schema:1,resource:70,mood:'спокойное',condition:'нормальное',projects:['Личное','Дом','Работа'],skills:{'Здоровье':0,'Имидж':0,'Экономика':0,'Дисциплина':0,'Психология':0,'Психотерапия':0,'Программирование':0},tasks:[],habits:[],log:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}if(!state.skills)state.skills=defaults().skills;if(!Array.isArray(state.tasks))state.tasks=[];if(!Array.isArray(state.log))state.log=[];const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state));const dialog=$('dialog');$('close').onclick=()=>dialog.close();function modal(title,buttons){$('dialogTitle').textContent=title;$('dialogBody').replaceChildren();for(const [name,fn] of buttons){const b=document.createElement('button');b.textContent=name;b.style.margin='4px';b.onclick=()=>{dialog.close();fn()};$('dialogBody').append(b)}dialog.showModal()}function resource(){state.resource=Math.max(0,Math.min(100,Number(state.resource)||0));$('resourceText').textContent=state.resource+'%';const c=state.resource>65?'#65e6c5':state.resource>35?'#f3ce6b':'#f07b91';$('crystal').style.color=c;$('crystal').style.setProperty('--glow',c);$('sim').style.opacity=state.resource<15?.7:1}function notice(text){$('msg').textContent=text;$('status').textContent=text.slice(0,45)}function gain(skill,xp,delta,text){state.skills[skill]=(state.skills[skill]||0)+xp;state.resource=Math.max(0,Math.min(100,state.resource+delta));state.log.push({type:'room',skill,xp,delta,text,at:new Date().toISOString()});save();resource();renderSkills();notice(text+' · '+(delta>=0?'+':'')+delta+' Ресурс · +'+xp+' XP');$('sim').classList.add('walk');setTimeout(()=>$('sim').classList.remove('walk'),900)}const objects={bed:[['Застелить кровать','Экономика',10,3],['Поменять бельё','Экономика',20,-2],['Отдохнуть','Здоровье',5,8]],sink:[['Вымыть руки','Здоровье',5,2],['Помыть раковину','Экономика',10,-1],['Помыть посуду','Экономика',15,-3]],books:[['Читать психологию','Психология',20,2],['Навести порядок','Экономика',10,-2]],desk:[['Заняться программированием','Программирование',20,-4],['Разобрать дела','Дисциплина',10,-2]]};const labels={bed:'Кровать',sink:'Раковина',books:'Книжный шкаф',desk:'Компьютер'};function openObject(id){modal(labels[id],objects[id].map(([title,skill,xp,delta])=>[title,()=>{notice('Сим выполняет: '+title);gain(skill,xp,delta,title+' (игровое действие)')}]))}document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>openObject(b.dataset.object));$('crystal').onclick=()=>{const input=document.createElement('input');input.type='range';input.min=0;input.max=100;input.value=state.resource;const output=document.createElement('b');output.textContent=input.value+'%';input.oninput=()=>output.textContent=input.value+'%';modal('Настроить Ресурс',[]);$('dialogBody').append(input,output);const b=document.createElement('button');b.textContent='Сохранить';b.onclick=()=>{state.resource=+input.value;save();resource();dialog.close()};$('dialogBody').append(b)};$('editRoom').onclick=()=>modal('Комната', [['Переставить кровать',()=>{const el=document.querySelector('.bed');el.style.left=el.style.left==='58%'?'4%':'58%';notice('Кровать переставлена (визуально)')}],['Изменить цвет стен',()=>{const el=$('back');el.style.background=el.style.background?'':'linear-gradient(130deg,#e4c8d4,#b6a5d5)';notice('Цвет стен изменён (визуально)')}]]);function renderTasks(){$('taskList').replaceChildren();for(const t of state.tasks){const div=document.createElement('div');div.className='listitem';const s=document.createElement('span');s.textContent=(t.done?'✓ ':'○ ')+t.name+' · '+(t.xp||20)+' XP';const b=document.createElement('button');b.textContent=t.done?'Готово':'Выполнить';b.disabled=!!t.done;b.onclick=()=>{t.done=true;t.completedAt=new Date().toISOString();state.skills['Дисциплина']=(state.skills['Дисциплина']||0)+(t.xp||20);save();renderTasks();renderSkills();notice('Задача выполнена: '+t.name)};div.append(s,b);$('taskList').append(div)}}function renderSkills(){$('skillList').replaceChildren();for(const [name,xp] of Object.entries(state.skills)){const p=document.createElement('p');p.textContent=name+': '+xp+' XP';$('skillList').append(p)}}$('taskForm').onsubmit=e=>{e.preventDefault();const name=$('taskName').value.trim();if(!name)return;state.tasks.push({id:Date.now().toString(36),name,xp:+$('xp').value,done:false});save();$('taskForm').reset();renderTasks()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));for(const t of ['tasks','skills','data'])$(t+'Tab').classList.toggle('hidden',t!==b.dataset.tab)});$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LifeSims-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('restore').onclick=async()=>{const f=$('restoreFile').files[0];if(!f)return alert('Выбери файл JSON');try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.tasks)||!x.skills||!Number.isFinite(x.resource))throw Error('Неверный формат');if(!confirm('Заменить текущие данные?'))return;const next={...defaults(),...x};if(!Array.isArray(next.log)||!Array.isArray(next.habits)||!next.skills||typeof next.skills!=='object'||Array.isArray(next.skills))throw Error('Неверная структура сохранения');localStorage.setItem(KEY,JSON.stringify(next));state=next;resource();renderTasks();renderSkills();notice('Данные импортированы')}catch(e){alert('Не удалось импортировать: '+e.message)}};resource();renderTasks();renderSkills();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
