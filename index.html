<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151a2a"><link rel="manifest" href="manifest.webmanifest"><title>LifeSims</title><style>body{background:#111827;color:#f4f5ff;font:16px system-ui;margin:auto;max-width:680px;padding:20px}h1{margin-bottom:4px}.card{background:#202a3d;border-radius:18px;padding:18px;margin:14px 0}button,input,select{font:inherit;padding:12px;border-radius:10px;border:0;margin:4px}button{background:#7b8cff;color:white}input,select{background:#121c2c;color:white;border:1px solid #56627b;max-width:90%}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #47536a;padding:8px 0}small{color:#b9c3d6}.warn{color:#ffd9a0}</style></head><body><h1>LifeSims</h1><small>Web Mini — первая опубликованная версия</small><div class="card"><h2>Ресурс: <span id="r"></span>%</h2><input id="range" type="range" min="0" max="100"><p>Настроение: <input id="mood" placeholder="Как ты себя чувствуешь?"></p><button id="save">Сохранить состояние</button></div><div class="card"><h2>Задачи</h2><form id="form"><input id="name" placeholder="Новая задача" required><select id="difficulty"><option value="5">Очень легко · 5 XP</option><option value="10">Легко · 10 XP</option><option value="20" selected>Средне · 20 XP</option><option value="40">Трудно · 40 XP</option></select><button>Добавить</button></form><div id="tasks"></div></div><div class="card"><h2>Навыки</h2><div id="skills"></div></div><div class="card"><h2>Данные</h2><p class="warn">Данные хранятся только в этом браузере. При переходе с локального HTML сначала экспортируй резервную копию, затем импортируй её здесь.</p><button id="export">Скачать резервную копию</button><input type="file" id="file" accept=".json,application/json"><button id="import">Импортировать</button></div><script>const KEY='lifesims-personal-mini-v1';const defaults=()=>({schema:1,resource:70,mood:'спокойное',condition:'нормальное',projects:['Личное','Дом','Работа'],skills:{'Здоровье':0,'Имидж':0,'Экономика':0,'Дисциплина':0,'Психология':0,'Психотерапия':0,'Программирование':0},tasks:[],habits:[],log:[]});let s;try{s=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{s=defaults()}const $=x=>document.getElementById(x);function persist(){localStorage.setItem(KEY,JSON.stringify(s))}function render(){$('r').textContent=s.resource;$('range').value=s.resource;$('mood').value=s.mood;$('tasks').replaceChildren();for(const t of s.tasks){const d=document.createElement('div');d.className='item';const label=document.createElement('span');label.textContent=(t.done?'✓ ':'○ ')+t.name+' · '+t.xp+' XP';if(t.done)label.style.opacity='.55';const b=document.createElement('button');b.textContent=t.done?'Готово':'Выполнить';b.disabled=t.done;b.onclick=()=>{t.done=true;t.completedAt=new Date().toISOString();s.skills['Дисциплина']=(s.skills['Дисциплина']||0)+5;if(t.skill)s.skills[t.skill]=(s.skills[t.skill]||0)+t.xp;s.log.push({type:'task',id:t.id,at:t.completedAt});persist();render()};d.append(label,b);$('tasks').append(d)}$('skills').replaceChildren();for(const [k,v] of Object.entries(s.skills)){const p=document.createElement('p');p.textContent=k+': '+v+' XP';$('skills').append(p)}}$('save').onclick=()=>{s.resource=+$('range').value;s.mood=$('mood').value;persist();render()};$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;s.tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,project:'Личное',skill:'Дисциплина',xp:+$('difficulty').value,due:'',body:0,mood:0,done:false});persist();$('form').reset();render()};$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='LifeSims-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=async()=>{const f=$('file').files[0];if(!f)return alert('Выбери JSON-файл');try{const v=JSON.parse(await f.text());if(v.schema!==1||!Array.isArray(v.tasks)||!Array.isArray(v.habits)||!Array.isArray(v.projects)||!v.skills||!Number.isFinite(v.resource))throw Error('Неверный формат');if(!confirm('Заменить текущие данные резервной копией?'))return;s=v;persist();render()}catch(e){alert('Ошибка импорта: '+e.message)}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);render();</script></body></html>
